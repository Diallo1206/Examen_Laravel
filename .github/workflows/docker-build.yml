name: Build and Push Docker Image

on:
  push:
    branches:
      - _librairie  # ou remplace par 'Sy_Moussa_librairie' si c’est ta branche principale

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name:  Récupération du code source
        uses: actions/checkout@v3

      - name:  Connexion à Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Construction de l'image Docker
        run: |
          docker build -t docker.io/abdou23/Bibliotheque:latest .

      - name: 🚀 Envoi de l'image vers Docker Hub
        run: |
          docker push docker.io/abdou23/Bibliotheque:latest

      - name: 🔒 Déconnexion de Docker Hub
        run: |
          docker logout
